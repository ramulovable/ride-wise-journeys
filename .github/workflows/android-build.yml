name: Build Shahin Travels App

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      version_code:
        description: "Play Store version code (must increase every upload)"
        required: true
        default: "1"
  push:
    tags:
      - "android-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
      ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Add Firebase config (for ride alerts)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      - name: Decode signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build APK (direct download) and AAB (Play Store)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename artifacts
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/*.apk "dist-android/ShahinTravels-v${ANDROID_VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "dist-android/ShahinTravels-v${ANDROID_VERSION_NAME}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: shahin-travels-app-${{ env.ANDROID_VERSION_NAME }}
          path: dist-android/*

      - name: Publish GitHub Release (public download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.ANDROID_VERSION_NAME }}
          name: Shahin Travels v${{ env.ANDROID_VERSION_NAME }}
          files: dist-android/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
